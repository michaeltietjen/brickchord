<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bricklab web: make songs and play live in your browser</title>
<meta name="description" content="The Brickchord suite in your browser, on the handheld's own engine: build Bricklab songs and copy them to your TrimUI Brick, R36 or PortMaster device, or play Brickchord live with keyboard, mouse, touch or MIDI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#16213f;--panel:#1e2d5a;--seam:#2b3c70;--deep:#0e1530;--ink:#ece4d6;--dim:#a3acc9;--teal:#2bb3b1;--orange:#ff5a1f;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,Helvetica,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 22px;background:var(--deep);border-bottom:1px solid var(--seam)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.4px;text-decoration:none;color:var(--ink)}
.logo span{font-weight:500;color:var(--dim)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{display:flex;align-items:baseline;gap:8px;padding:8px 16px;border-radius:10px;border:1px solid var(--seam);background:transparent;color:var(--ink);cursor:pointer;font:600 15px Archivo,Helvetica,sans-serif}
nav button small{font:500 11px var(--mono);color:var(--dim);letter-spacing:.4px}
nav button:hover:not(:disabled){border-color:var(--teal)}
nav button[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:var(--deep)}
nav button[aria-selected=true] small{color:var(--deep)}
nav button[data-tab=chord][aria-selected=true]{background:var(--orange);border-color:var(--orange)}
nav button:disabled{opacity:.45;cursor:default}
.site{margin-left:auto;font:500 12px var(--mono);color:var(--dim);text-decoration:none}
.site:hover{color:var(--teal)}
#frames{flex:1;position:relative;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#frames iframe[hidden]{display:none}
</style>
</head>
<body>
<div class="bar">
  <a class="logo" href="../"><svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true"><rect width="7" height="7" rx="1.5" fill="#2bb3b1"/><rect x="9.5" width="7" height="7" rx="1.5" fill="#ece4d6"/><rect x="19" width="7" height="7" rx="1.5" fill="#ece4d6"/><rect y="9.5" width="7" height="7" rx="1.5" fill="#ece4d6"/><rect x="9.5" y="9.5" width="7" height="7" rx="1.5" fill="#ece4d6"/><rect x="19" y="9.5" width="7" height="7" rx="1.5" fill="#ece4d6"/><rect y="19" width="7" height="7" rx="1.5" fill="#ece4d6"/><rect x="9.5" y="19" width="7" height="7" rx="1.5" fill="#ece4d6"/><rect x="19" y="19" width="7" height="7" rx="1.5" fill="#ece4d6"/></svg>bricklab <span>web</span></a>
  <nav role="tablist" aria-label="Apps">
    <button role="tab" data-tab="lab" aria-selected="false">Lab <small>make songs</small></button>
    <button role="tab" data-tab="chord" aria-selected="false">Chord <small>play live</small></button>
    <button role="tab" disabled title="Brickglide in the browser is on the way">Glide <small>soon</small></button>
  </nav>
  <a class="site" href="../">brickchord on the handheld &#8599;</a>
</div>
<div id="frames"></div>

<script>
"use strict";
// One app, two pages: Lab (lab.html, the song editor) and Chord (live.html, play live).
// Each loads the first time you open its tab and keeps running in the background, so
// switching back is instant and nothing is lost. The tab you leave goes quiet. Chord
// follows the key, scale and tempo of the song open in Lab.
const PAGES = { lab: "lab.html", chord: "live.html" };
const frames = {}, box = document.getElementById("frames");
let cur = null, song = null;
try { const s = JSON.parse(localStorage.getItem("bricklab-web-song")); if (s) song = { key: s.key % 12, scale: s.scale, bpm: Math.round(s.bpm) }; } catch (e) {}

function send(tab, msg) { const f = frames[tab]; if (f && f.contentWindow) f.contentWindow.postMessage(msg, location.origin); }
function show(tab) {
  if (!PAGES[tab]) tab = "lab";
  if (tab === cur) return;
  if (cur) { send(cur, { bl: "hide" }); frames[cur].hidden = true; }
  cur = tab;
  for (const b of document.querySelectorAll("nav button[data-tab]")) b.setAttribute("aria-selected", b.dataset.tab === tab);
  let f = frames[tab];
  if (!f) {
    f = frames[tab] = document.createElement("iframe");
    f.title = tab === "lab" ? "Lab: make songs" : "Chord: play live";
    f.allow = "midi; autoplay";
    f.src = PAGES[tab];
    f.onload = () => { if (cur === tab) { send(tab, { bl: "show", song }); f.contentWindow.focus(); } };
    box.append(f);
  } else {
    f.hidden = false;
    send(tab, { bl: "show", song });
    f.contentWindow.focus();
  }
  if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
}
addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.bl === "song") song = e.data.song;
  if (e.data.bl === "tab") show(e.data.tab);
});
for (const b of document.querySelectorAll("nav button[data-tab]")) b.onclick = () => show(b.dataset.tab);
addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1) || "lab");
</script>
</body>
</html>

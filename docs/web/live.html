<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brickchord live: play it in your browser</title>
<meta name="description" content="Brickchord in your browser: chords, lead, drones, effects and beats from the handheld's own engine. Keyboard, mouse, touch or MIDI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--chassis:#e4e2dc;--plate:#efede8;--ink:#18161c;--dim:#6d6874;--seam:#cfccc4;--orange:#ff5a1f;--teal:#3f9e95;--screen:#121016;--sink:#ece4d6;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--chassis);color:var(--ink);font-family:Archivo,Helvetica,sans-serif}
button,select,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 22px;border-bottom:1px solid var(--seam)}
.logo{font-weight:800;font-size:21px;letter-spacing:-.4px;text-decoration:none;color:var(--ink)}
.logo span{font-weight:500;color:var(--dim)}
main{max-width:1060px;margin:0 auto;padding:20px 22px 60px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:10px;border:1px solid var(--seam);background:var(--plate);cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600}
.tab[aria-pressed=true]{background:var(--ink);color:var(--plate);border-color:var(--ink)}
.screen{background:var(--screen);color:var(--sink);border-radius:16px;padding:16px 22px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;border:8px solid #26242b}
.top{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:1px;color:#a39fae}
.big{font-weight:900;font-size:clamp(60px,13vw,112px);letter-spacing:-3px;line-height:1;color:var(--orange);text-align:center}
.sub{font-family:var(--mono);font-size:14px;text-align:center;min-height:20px}
.deck{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:16px;align-items:center}
.pads{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.pad{height:96px;border-radius:14px;border:0;background:var(--plate);box-shadow:0 4px 0 var(--seam);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;user-select:none}
.pad b{font-size:21px;font-weight:800}
.pad span{font-family:var(--mono);font-size:12px;color:var(--dim)}
.pad.on{background:var(--orange);box-shadow:0 1px 0 #c33f0e;transform:translateY(3px)}
.pad.on span{color:var(--ink)}
.pad.drone{outline:3px solid var(--teal);outline-offset:-3px}
.stick{display:flex;flex-direction:column;align-items:center;gap:6px}
.xy{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#26242b 0 28%,var(--screen) 29%);border:6px solid var(--seam);position:relative;touch-action:none;cursor:grab}
.xy i{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--plate);box-shadow:0 3px 0 var(--seam);left:42px;top:42px;pointer-events:none}
.stick span{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;min-height:28px}
.mods{display:flex;flex-wrap:wrap;gap:8px}
.mod{padding:10px 14px;border-radius:999px;border:1px solid var(--seam);background:var(--plate);cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600;touch-action:none;user-select:none}
.mod.on{background:var(--ink);color:var(--plate);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:var(--dim)}
select,input[type=number]{background:var(--plate);border:1px solid var(--seam);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:13px}
input[type=range]{accent-color:var(--orange);width:120px}
.panel{background:var(--plate);border:1px solid var(--seam);border-radius:14px;padding:14px 16px}
.cap{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--dim);margin:0 0 10px}
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.fx{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--chassis)}
.fx.on{background:#ffe2d6}
.fx b{font-size:14px}
.fx select{padding:4px 6px;font-size:12px}
.fx input[type=range]{width:100%}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--seam);background:var(--plate);cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600}
.btn.primary{background:var(--orange);border-color:var(--orange)}
.stat{font-family:var(--mono);font-size:12px;color:var(--dim)}
.hint{font-size:14px;line-height:1.55;color:#4a4650;margin:0}
kbd{font-family:var(--mono);font-size:12px;background:var(--plate);border:1px solid var(--seam);border-radius:5px;padding:1px 6px}
.start{position:fixed;inset:0;background:rgba(228,226,220,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;text-align:center;padding:20px}
.start b{font-size:30px;font-weight:900}
[hidden]{display:none!important}
@media (max-width:760px){.deck{grid-template-columns:1fr 1fr}.pads{grid-column:1/-1;order:-1;grid-template-columns:repeat(4,minmax(0,1fr))}.pad{height:78px}}
</style>
</head>
<body>
<div class="start" id="start"><b>Brickchord live</b><p class="hint" id="startmsg">The Brick's own engine, playing in your browser. Loads about 10 MB the first time.</p><button class="btn primary" id="go">Start</button></div>

<header>
  <a class="logo" href="./">bricklab <span>web</span></a>
  <span class="stat">BRICKCHORD LIVE</span>
  <span class="stat" id="stat" style="margin-left:auto" role="status"></span>
</header>

<main>
  <div class="tabs" role="group" aria-label="Mode">
    <button class="tab" data-mode="play" aria-pressed="true">Play</button>
    <button class="tab" data-mode="lead" aria-pressed="false">Lead</button>
    <button class="tab" data-mode="drone" aria-pressed="false">Drone</button>
  </div>

  <div class="screen" aria-live="polite">
    <div class="top"><span id="keyname">A MINOR</span><span id="modename">CHORD</span><span id="soundname">JUNO PAD</span></div>
    <div class="big" id="big">-</div>
    <div class="sub" id="sub">press a chord</div>
  </div>

  <div class="deck">
    <div class="stick"><div class="xy" id="lstick" aria-label="Left stick"><i></i></div><span id="lhint">bend the chord<br>8 ways</span></div>
    <div class="pads" id="pads"></div>
    <div class="stick"><div class="xy" id="rstick" aria-label="Right stick"><i></i></div><span>&#8592; filter · resonance &#8594;<br>&#8593; space · dry &#8595;</span></div>
  </div>

  <div class="mods" id="mods"></div>

  <div class="row">
    <label class="f" id="playbox">PLAY<select id="sMode"></select></label>
    <label class="f">SOUND<select id="sSound"></select></label>
    <label class="f">BASS<select id="sBass"></select></label>
    <label class="f">KEY<select id="sKey"></select></label>
    <label class="f">SCALE<select id="sScale"><option>Major</option><option selected>Minor</option><option>Dorian</option><option>Mixolydian</option></select></label>
    <label class="f">BEAT<select id="sBeat"></select></label>
    <label class="f">BPM<input type="number" id="iBpm" value="96" min="50" max="200" style="width:76px"></label>
    <label class="f">DELAY<select id="sAhead"><option value="2">Low (riskier)</option><option value="3" selected>Normal</option><option value="5">Safe</option></select></label>
  </div>

  <section class="panel" aria-label="Effects">
    <p class="cap">EFFECTS RACK · STACK ANY OF THEM · SYNCED TO THE BPM</p>
    <div class="rack" id="rack"></div>
    <div class="row" style="margin-top:12px">
      <label class="f">REVERB <input type="range" id="rRev" min="0" max="1" step="0.01" value="0.25"></label>
      <label class="f">DELAY <input type="range" id="rDly" min="0" max="0.8" step="0.01" value="0"></label>
      <label class="f">DELAY TIME<select id="sDlyT"></select></label>
      <label class="f">VOLUME <input type="range" id="rVol" min="0" max="1" step="0.01" value="0.8"></label>
    </div>
  </section>

  <p class="hint" id="help"></p>
</main>

<script>
"use strict";
const NOTE_NAMES = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const SCALES = {Major:[0,2,4,5,7,9,11], Minor:[0,2,3,5,7,8,10], Dorian:[0,2,3,5,7,9,10], Mixolydian:[0,2,4,5,7,9,10]};
const KEYS = {Digit1:0,Digit2:1,Digit3:2,Digit4:3,Digit5:4,Digit6:5,Digit7:6,KeyA:0,KeyS:1,KeyD:2,KeyF:3,KeyG:4,KeyH:5,KeyJ:6};
const MODS = {play:{KeyQ:["seventh","7th"],KeyW:["sus","sus4"],KeyE:["ninth","9th"],KeyR:["flip","flip"]},
              lead:{KeyQ:["up","oct +"],KeyW:["down","oct -"],KeyE:["sharp","+1"]},
              drone:{KeyQ:["third","+ third"]}};
const HELP = {
  play: "<kbd>1</kbd>–<kbd>7</kbd> or <kbd>A</kbd>–<kbd>J</kbd> play the seven chords of the key. Hold <kbd>Q</kbd> 7th, <kbd>W</kbd> sus4, <kbd>E</kbd> 9th, <kbd>R</kbd> flip. Drag the left stick to bend the chord 8 ways. <kbd>Z</kbd> <kbd>X</kbd> step through the play modes.",
  lead: "Lead: the seven keys are the notes of the scale, one at a time. Hold <kbd>Q</kbd> octave up, <kbd>W</kbd> octave down, <kbd>E</kbd> a semitone up. Turn on Glide in the rack to slide between notes. The left stick bends (sideways) and adds vibrato (up). A MIDI keyboard plays it note for note; its pitch bend and mod wheel work too.",
  drone: "Drone: each key holds a root, fifth and octaves underneath; press it again to stop. Hold <kbd>Q</kbd> to add the third. The left stick shapes it: down pulses, up swells, left thins, right blooms. Switch to Play or Lead and the drone keeps going under you."
};
const $ = (id) => document.getElementById(id);
const el = (t, a, ...k) => { const e = document.createElement(t); for (const [x, v] of Object.entries(a || {})) { if (x === "class") e.className = v; else if (x.startsWith("on")) e.addEventListener(x.slice(2), v); else e.setAttribute(x, v); } e.append(...k); return e; };

let AW, RW, AC, NODE, names, SOUND = 0, CUR_PJ = null, MODE = "play", held = [], mods = {}, stickMod = null, beatOn = false, droneDeg = null;
let rid = 0; const wait = {};
function rpc(w, op, arg, ports) { const id = ++rid; return new Promise((res, rej) => { wait[id] = {res, rej}; w.postMessage({id, op, arg}, ports || []); }); }
function onmsg(e) { if (e.data.progress) return progress(e.data.progress); const w = wait[e.data.id]; delete wait[e.data.id]; if (w) e.data.ok ? w.res(e.data.r) : w.rej(new Error(e.data.err)); }
let prog = "";
function progress(p) { if (p.sound === SOUND) prog = p.done < p.total ? "notes " + p.done + "/" + p.total : ""; }

async function start() {
  $("go").disabled = true; $("startmsg").textContent = "Loading the engine...";
  AC = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050, latencyHint: "interactive" });
  await AC.audioWorklet.addModule("live-worklet.js?t=" + Date.now());
  NODE = new AudioWorkletNode(AC, "brick-out", { outputChannelCount: [2] });
  NODE.connect(AC.destination);
  const man = await (await fetch("manifest.json", { cache: "no-cache" })).json();
  AW = new Worker("live-audio.js?t=" + Date.now()); AW.onmessage = onmsg;
  RW = new Worker("live-render.js?t=" + Date.now()); RW.onmessage = onmsg;
  const toAudio = new MessageChannel(), toOut = new MessageChannel();
  names = await rpc(AW, "init", { files: man.files });
  await rpc(RW, "init", { files: man.files.filter(f => f.startsWith("py/")) }, [toAudio.port1]);
  await rpc(AW, "notes", null, [toAudio.port2]);
  NODE.port.postMessage({ port: toOut.port1 }, [toOut.port1]);
  await rpc(AW, "out", null, [toOut.port2]);
  const groups = ["Chord sounds", "Lead sounds", "Drone sounds"]; let gi = 0, left = names.groups[0], og = el("optgroup", {label: groups[0]});
  names.sounds.forEach((n, i) => { if (i === left) { $("sSound").append(og); gi++; left += names.groups[gi]; og = el("optgroup", {label: groups[gi]}); } og.append(el("option", {value: i}, n)); });
  $("sSound").append(og);
  names.beats.forEach((n, i) => $("sBeat").append(el("option", {value: i}, n))); $("sBeat").value = 1;
  names.modes.forEach(n => $("sMode").append(el("option", {value: n}, n)));
  names.bass.forEach(n => $("sBass").append(el("option", {value: n}, n)));
  names.delay_times.forEach((n, i) => $("sDlyT").append(el("option", {value: i}, n))); $("sDlyT").value = 2;
  for (let k = 0; k < 12; k++) $("sKey").append(el("option", {value: k}, NOTE_NAMES[k]));
  $("sKey").value = 9;
  buildRack();
  stick($("lstick"), leftStick); stick($("rstick"), (x, y) => rpc(AW, "right", { x, y }));
  setMode("play");
  await setKey(); await setSound(0);
  $("start").remove();
  statLoop(); midi();
}

// ---------------------------------------------------------------- modes
function setMode(m) {
  if (MODE === "lead" && m !== "lead") rpc(AW, "lead_off");
  if (MODE === "play" && m !== "play") rpc(AW, "release");
  MODE = m; held = []; mods = {};
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-pressed", t.dataset.mode === m);
  $("playbox").hidden = m !== "play";
  $("modename").textContent = m === "play" ? $("sMode").value.toUpperCase() : m.toUpperCase();
  $("lhint").innerHTML = {play: "bend the chord<br>8 ways", lead: "bend · vibrato", drone: "pulse · swell<br>thin · bloom"}[m];
  $("help").innerHTML = HELP[m];
  const box = $("mods"); box.replaceChildren();
  for (const [code, [k, l]] of Object.entries(MODS[m])) box.append(el("button", {class: "mod", "data-m": k,
    onpointerdown: (e) => { e.preventDefault(); setMod(k, true); }, onpointerup: () => setMod(k, false), onpointerleave: () => setMod(k, false)}, l));
  drawPads(); $("big").textContent = "-"; $("sub").textContent = {play: "press a chord", lead: "press a note", drone: "press a degree to hold a drone"}[m];
}
let CHORD_NAMES = [];
function drawPads() {
  const box = $("pads"); box.replaceChildren();
  const sc = SCALES[$("sScale").value], key = +$("sKey").value;
  for (let d = 0; d < 7; d++) {
    const top = MODE === "play" ? CHORD_NAMES[d] || "" : NOTE_NAMES[(key + sc[d]) % 12];
    box.append(el("button", {class: "pad" + (MODE === "drone" && droneDeg === d ? " drone" : ""), "data-d": d, "aria-label": (MODE === "lead" ? "Note " : MODE === "drone" ? "Drone on " : "Chord ") + top,
      onpointerdown: (e) => { e.preventDefault(); press(d); }, onpointerup: () => lift(d), onpointerleave: () => lift(d)}, el("b", {}, top), el("span", {}, (d + 1) + "")));
  }
}
async function setKey() {
  const r = await rpc(AW, "key", { key: +$("sKey").value, scale: $("sScale").value });
  CHORD_NAMES = r.names;
  $("keyname").textContent = (NOTE_NAMES[+$("sKey").value] + " " + $("sScale").value).toUpperCase();
  drawPads();
  if (CUR_PJ) rpc(RW, "render", { sound: SOUND, pj: CUR_PJ, midis: r.wanted });
}
async function setSound(i) {
  SOUND = i;
  const r = await rpc(AW, "sound", { i });
  CUR_PJ = r.pj;
  $("soundname").textContent = names.sounds[i].toUpperCase();
  await rpc(RW, "render", { sound: i, pj: r.pj, midis: r.wanted });
}
function curMods() { const m = Object.assign({}, mods); if (stickMod) m[stickMod] = true; return m; }
async function press(d) {
  if (MODE === "drone") {
    if (droneDeg === d) { droneDeg = null; rpc(AW, "drone_off"); $("sub").textContent = "drone off"; drawPads(); return; }
    const r = await rpc(AW, "drone", { degree: d, third: !!mods.third });
    if (r.ready) { droneDeg = d; $("big").textContent = r.name; $("sub").textContent = "drone held · press again to stop"; } else $("sub").textContent = "sound still loading...";
    drawPads(); return;
  }
  if (held.includes(d)) return;
  held.push(d);
  for (const p of document.querySelectorAll(".pad")) p.classList.toggle("on", +p.dataset.d === d);
  if (MODE === "lead") {
    const r = await rpc(AW, "lead", { degree: d, up: mods.up, down: mods.down, sharp: mods.sharp });
    $("big").textContent = r.ready ? r.name : "-"; $("sub").textContent = r.ready ? "lead" : "sound still loading...";
    return;
  }
  const r = await rpc(AW, "chord", { degree: d, mods: curMods() });
  $("big").textContent = r.name;
  $("sub").textContent = r.ready ? (r.roman || "") + (r.standins ? "  · " + r.standins + " notes still rendering" : "") : "sound still loading...";
}
function lift(d) {
  if (MODE === "drone" || !held.includes(d)) return;
  held = held.filter(x => x !== d);
  document.querySelector('.pad[data-d="' + d + '"]')?.classList.remove("on");
  if (held.length) { const n = held.pop(); press(n); return; }
  rpc(AW, MODE === "lead" ? "lead_off" : "release");
}
function setMod(m, on) {
  if (!!mods[m] === on) return;
  if (on) mods[m] = true; else delete mods[m];
  document.querySelector('.mod[data-m="' + m + '"]')?.classList.toggle("on", on);
  if (MODE !== "drone" && held.length) { const d = held.pop(); press(d); }
}

// ---------------------------------------------------------------- sticks
function stick(pad, cb) {
  const knob = pad.querySelector("i"); let id = null;
  const move = (e) => {
    const r = pad.getBoundingClientRect(), R = r.width / 2 - 22;
    let x = (e.clientX - r.left - r.width / 2) / R, y = -(e.clientY - r.top - r.height / 2) / R;
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    knob.style.left = (42 + x * R) + "px"; knob.style.top = (42 - y * R) + "px";
    cb(x, y);
  };
  pad.addEventListener("pointerdown", (e) => { id = e.pointerId; pad.setPointerCapture(id); move(e); });
  pad.addEventListener("pointermove", (e) => { if (e.pointerId === id) move(e); });
  const up = (e) => { if (e.pointerId !== id) return; id = null; knob.style.left = "42px"; knob.style.top = "42px"; cb(0, 0); };
  pad.addEventListener("pointerup", up); pad.addEventListener("pointercancel", up);
}
let lastL = 0;
async function leftStick(x, y) {
  if (MODE === "lead") return rpc(AW, "lead_mod", { bend: x, vib: Math.max(0, y) });
  if (MODE === "drone") return rpc(AW, "drone_mod", { x, y });
  const now = performance.now(); if (now - lastL < 30 && (x || y)) return; lastL = now;
  const m = await rpc(AW, "chord_mod", { x, y });
  if (m !== stickMod) { stickMod = m; if (held.length) { const d = held.pop(); press(d); } $("lhint").innerHTML = m ? "bend: " + m : "bend the chord<br>8 ways"; }
}

// ---------------------------------------------------------------- effects
function buildRack() {
  const box = $("rack");
  for (const n of names.fx) {
    const [amt, rate] = names.fx_defaults[n];
    const on = el("input", {type: "checkbox", "aria-label": n + " on"});
    const a = el("input", {type: "range", min: 0, max: 1, step: 0.01, value: amt, "aria-label": n + " amount"});
    const rs = el("select", {"aria-label": n + (n === "Cloud" ? " texture" : " rate")});
    (n === "Cloud" ? names.clouds : n === "Glide" ? ["time"] : names.rates).forEach((r, i) => rs.append(el("option", {value: i}, r)));
    rs.value = n === "Glide" ? 0 : rate; if (["Drive","Lo-fi","Wide","Glide"].includes(n)) rs.hidden = true;
    const card = el("label", {class: "fx"}, on, el("b", {}, n), rs, el("span"), a);
    const send = () => { card.classList.toggle("on", on.checked); rpc(AW, "fx", { name: n, on: on.checked, amount: +a.value, rate: +rs.value }); };
    on.onchange = send; a.oninput = send; rs.onchange = send;
    box.append(card);
  }
  const sp = () => rpc(AW, "space", { rev: +$("rRev").value, dly: +$("rDly").value, time: +$("sDlyT").value, vol: +$("rVol").value });
  for (const id of ["rRev", "rDly", "rVol"]) $(id).oninput = sp;
  $("sDlyT").onchange = sp;
}

// ---------------------------------------------------------------- beat, status, MIDI
function beat(on) { beatOn = on; rpc(AW, "beat", { on, i: +$("sBeat").value, bpm: +$("iBpm").value || 96 }); }
async function statLoop() {
  const s = await rpc(AW, "stats");
  const ms = Math.round(1000 * (s.buffered / 22050 + (AC.baseLatency || 0) + (AC.outputLatency || 0)));
  $("stat").textContent = "delay ≈ " + ms + " ms · dropouts " + s.under + (prog ? " · " + prog : "") + (MIDI ? " · " + MIDI : "") + (AC.sampleRate !== 22050 ? " · resampling from " + AC.sampleRate : "");
  setTimeout(statLoop, 400);
}
let MIDI = "", due = null, midiDeg = null, midiChord = null;
const on = new Set();
// One key plays the chord on that degree (or the note in Lead, the drone in Drone).
// Two or more keys together play that exact chord, as on the handheld.
function degreeOf(n) { const sc = SCALES[$("sScale").value], pc = (n - +$("sKey").value + 120) % 12;
  let d = 0, best = 99; sc.forEach((s, i) => { const dd = Math.min((pc - s + 12) % 12, (s - pc + 12) % 12); if (dd < best) { best = dd; d = i; } }); return d; }
async function midiNow() {
  const notes = [...on].sort((x, y) => x - y);
  if (notes.length >= 2 && MODE === "play") {
    if (midiDeg !== null) { held = held.filter(x => x !== midiDeg); midiDeg = null; }
    const key = notes.join(",");
    if (key === midiChord) return;
    midiChord = key;
    const r = await rpc(AW, "exact", { notes });
    $("big").textContent = r.name; $("sub").textContent = r.ready ? (r.roman || "") + " · from MIDI" : "sound still loading...";
  } else if (notes.length) {
    const d = degreeOf(notes[notes.length - 1]);
    midiChord = null;
    if (d !== midiDeg) { if (midiDeg !== null) held = held.filter(x => x !== midiDeg); midiDeg = d; press(d); }
  } else {
    if (midiDeg !== null) { const d = midiDeg; midiDeg = null; lift(d); }

async function midi() {
  if (!navigator.requestMIDIAccess) { MIDI = "MIDI: not in this browser (use Chrome or Edge)"; return; }
  try {
    const acc = await navigator.requestMIDIAccess();
    const hook = (inp) => inp.onmidimessage = (m) => {
      const [st, a, b] = m.data, cmd = st & 0xf0;
      if (st === 0xF8 || st === 0xFE) return;               // clock and active sensing: not notes
      MIDI = "MIDI in: " + inp.name + " · " + [...m.data].slice(0, 3).map(x => x.toString(16).toUpperCase().padStart(2, "0")).join(" ");
      if (cmd === 0xE0) { if (MODE === "lead") rpc(AW, "lead_mod", { bend: ((b << 7 | a) - 8192) / 8192, vib: 0 }); return; }
      if (cmd === 0xB0 && a === 1) { if (MODE === "lead") rpc(AW, "lead_mod", { bend: 0, vib: b / 127 }); return; }
      if (cmd !== 0x90 && cmd !== 0x80) return;

    };
    const scan = () => { const ins = [...acc.inputs.values()]; ins.forEach(hook);
      MIDI = ins.length ? "MIDI: " + ins.map(i => i.name).join(", ") : "MIDI: no keyboard found (plug one in)"; };
    scan(); acc.onstatechange = scan;
  } catch (e) { MIDI = "MIDI: permission refused (allow it in the address bar)"; }
}

// ---------------------------------------------------------------- wiring
$("go").onclick = () => start().catch(e => { $("startmsg").textContent = "Couldn't start: " + e.message; $("go").disabled = false; });
for (const t of document.querySelectorAll(".tab")) t.onclick = () => setMode(t.dataset.mode);
$("sSound").onchange = (e) => setSound(+e.target.value);
function setPlay(m) { $("sMode").value = m; rpc(AW, "mode", { mode: m }); if (MODE === "play") $("modename").textContent = m.toUpperCase(); if (held.length) press(held.pop()); }
$("sMode").onchange = (e) => setPlay(e.target.value);
$("sBass").onchange = (e) => rpc(AW, "bass", { mode: e.target.value });
$("sKey").onchange = setKey; $("sScale").onchange = setKey;
$("sBeat").onchange = () => { if (beatOn) beat(true); };
$("iBpm").onchange = () => { if (beatOn) beat(true); };
$("sAhead").onchange = (e) => rpc(AW, "ahead", { frames: +e.target.value * 512 });
document.addEventListener("keydown", (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || ["INPUT","SELECT"].includes(document.activeElement.tagName)) return;
  if (e.code in KEYS) { e.preventDefault(); press(KEYS[e.code]); }
  else if (MODS[MODE] && e.code in MODS[MODE]) setMod(MODS[MODE][e.code][0], true);
  else if (e.code === "Space") { e.preventDefault(); beat(!beatOn); }
  else if ((e.code === "KeyZ" || e.code === "KeyX") && MODE === "play") { const m = names.modes, i = m.indexOf($("sMode").value); setPlay(m[(i + (e.code === "KeyX" ? 1 : m.length - 1)) % m.length]); }
  else if (e.code === "Tab") { e.preventDefault(); const ms = ["play", "lead", "drone"]; setMode(ms[(ms.indexOf(MODE) + 1) % 3]); }
});
document.addEventListener("keyup", (e) => { if (e.code in KEYS) lift(KEYS[e.code]); else if (MODS[MODE] && e.code in MODS[MODE]) setMod(MODS[MODE][e.code][0], false); });
</script>
